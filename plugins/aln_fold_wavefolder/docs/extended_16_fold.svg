  <text class="label" x="78" y="718">Lower summer · nlow</text>
  <text class="value" x="78" y="741">RLOWIN: in → nlow · 187 kΩ · RFLOW: vpos → nlow · 100 kΩ</text>
  <text class="value" x="78" y="760">BLOW: vpos = 15·tanh(−10⁶·V(nlow)/15)</text>
  <rect class="active" x="708" y="690" width="634" height="94" rx="14"/>
  <text class="label" x="728" y="718">Upper/output summer · nup</text>
  <text class="value" x="728" y="741">RPOS: vpos → nup · 100 kΩ · RFUP: out → nup · 1.8 MΩ</text>
  <text class="value" x="728" y="760">COUT: out ↔ nup · 100 pF · BUP uses the same ±15 V rail law</text>
  <text class="note" x="58" y="808">Every cell is an inverting behavioral op-amp with its listed E96 RIN and 100 kΩ feedback resistor.</text>
  <text class="note" x="58" y="829">Odd-numbered sense nodes feed nup; even-numbered nodes feed nlow with progressively stronger weights.</text>
  <text class="note" x="58" y="850">Teacher sweep: VINPUT = 0…+5 V in 2.5 mV steps; the learned odd transfer mirrors this positive half.</text>
