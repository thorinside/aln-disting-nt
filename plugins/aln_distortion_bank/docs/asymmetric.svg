<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Asymmetric · SPICE teacher topology</title>
  <desc id="description">An ngspice asymmetric clipper with a ten kilohm input resistor, one megohm load, one silicon diode in one direction, and two series silicon diodes in the other.</desc>
  <defs>
    <style>

      .background { fill: #f7f5ef; }
      .panel { fill: #ffffff; stroke: #d8d3c7; stroke-width: 2; }
      .wire { fill: none; stroke: #273136; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .control { fill: none; stroke: #688899; stroke-width: 2; stroke-dasharray: 7 6; }
      .node { fill: #273136; }
      .nodebox { fill: #273136; stroke: #273136; stroke-width: 2; }
      .passive { fill: #fffaf0; stroke: #273136; stroke-width: 2; }
      .active { fill: #fff0dd; stroke: #ad5a23; stroke-width: 3; }
      .source { fill: #e9f4f7; stroke: #2f718c; stroke-width: 3; }
      .supply { fill: #a43b32; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #202528; }
      .subtitle { font: 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #596268; }
      .label { font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #252b2f; }
      .value { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #4f585d; }
      .node-label { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #ffffff; }
      .note { font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #596268; }
      .small { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #596268; }
      .tablehead { fill: #e9f4f7; stroke: #b8cbd2; stroke-width: 2; }
      .tablerow { fill: #fffdfa; stroke: #ddd7ca; stroke-width: 1; }

    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f718c"/>
    </marker>
  </defs>
  <rect class="background" width="1200" height="720" rx="24"/>
  <rect class="panel" x="24" y="24" width="1152" height="672" rx="18"/>
  <text class="title" x="58" y="70">Asymmetric · SPICE teacher topology</text>
  <text class="subtitle" x="58" y="98">Exact documentation view of models/asymmetric.cir</text>
  <line class="wire" x1="115" y1="300" x2="120" y2="450"/>
  <line class="wire" x1="120" y1="450" x2="600" y2="555"/>
  <line class="wire" x1="115" y1="300" x2="360" y2="300"/>
  <line class="wire" x1="360" y1="300" x2="600" y2="300"/>
  <line class="wire" x1="600" y1="300" x2="600" y2="430"/>
  <line class="wire" x1="600" y1="430" x2="600" y2="555"/>
  <line class="wire" x1="600" y1="300" x2="760" y2="355"/>
  <line class="wire" x1="760" y1="355" x2="600" y2="555"/>
  <line class="wire" x1="600" y1="555" x2="790" y2="520"/>
  <line class="wire" x1="790" y1="520" x2="900" y2="430"/>
  <line class="wire" x1="900" y1="430" x2="930" y2="345"/>
  <line class="wire" x1="930" y1="345" x2="600" y2="300"/>
  <rect class="nodebox" x="88.0" y="285" width="54" height="30" rx="15"/>
  <text class="node-label" text-anchor="middle" x="115" y="304">in</text>
  <rect class="nodebox" x="573.0" y="285" width="54" height="30" rx="15"/>
  <text class="node-label" text-anchor="middle" x="600" y="304">out</text>
  <line x1="627.0" y1="300" x2="691.0" y2="300" stroke="#2f718c" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="label" x="637.0" y="287" fill="#2f718c">teacher output</text>
  <rect class="nodebox" x="573.0" y="540" width="54" height="30" rx="15"/>
  <text class="node-label" text-anchor="middle" x="600" y="559">0</text>
  <rect class="nodebox" x="867.0" y="415" width="66" height="30" rx="15"/>
  <text class="node-label" text-anchor="middle" x="900" y="434">series</text>
  <rect class="source" x="38.0" y="423.0" width="164" height="54" rx="12"/>
  <text class="label" text-anchor="middle" x="120" y="446">VINPUT</text>
  <text class="value" text-anchor="middle" x="120" y="466">DC −5…+5 V</text>
  <rect class="passive" x="278.0" y="273.0" width="164" height="54" rx="12"/>
  <text class="label" text-anchor="middle" x="360" y="296">RIN</text>
  <text class="value" text-anchor="middle" x="360" y="316">10 kΩ</text>
  <rect class="passive" x="518.0" y="403.0" width="164" height="54" rx="12"/>
  <text class="label" text-anchor="middle" x="600" y="426">RLOAD</text>
  <text class="value" text-anchor="middle" x="600" y="446">1 MΩ</text>
  <rect class="active" x="678.0" y="328.0" width="164" height="54" rx="12"/>
  <text class="label" text-anchor="middle" x="760" y="351">D1</text>
  <text class="value" text-anchor="middle" x="760" y="371">DSI · out → 0</text>
  <rect class="active" x="708.0" y="493.0" width="164" height="54" rx="12"/>
  <text class="label" text-anchor="middle" x="790" y="516">D2</text>
  <text class="value" text-anchor="middle" x="790" y="536">DSI · 0 → series</text>
  <rect class="active" x="848.0" y="318.0" width="164" height="54" rx="12"/>
  <text class="label" text-anchor="middle" x="930" y="341">D3</text>
  <text class="value" text-anchor="middle" x="930" y="361">DSI · series → out</text>
  <text class="note" x="58" y="608">One diode clips one polarity; two series diodes set the opposite threshold.</text>
  <text class="note" x="58" y="629">DSI: Is=2 nA, N=1.8, Rs=2 Ω, Cjo=2 pF.</text>
  <text class="note" x="58" y="650">Teacher sweep: VINPUT = −5…+5 V in 2.5 mV steps; output is V(out).</text>
</svg>
