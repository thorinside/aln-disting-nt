<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">CMOS Inverter · biased feedback teacher</title>
  <desc id="description">A resistively biased CMOS inverter with one megohm supply divider, a 100 kilohm input resistor, 330 kilohm feedback resistor, complementary level-one MOSFETs, and a phase-restoring behavioral output.</desc>
  <defs>
    <style>

      .background { fill: #f7f5ef; }
      .panel { fill: #ffffff; stroke: #d8d3c7; stroke-width: 2; }
      .wire { fill: none; stroke: #273136; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .control { fill: none; stroke: #688899; stroke-width: 2; stroke-dasharray: 7 6; }
      .node { fill: #273136; }
      .nodebox { fill: #273136; stroke: #273136; stroke-width: 2; }
      .passive { fill: #fffaf0; stroke: #273136; stroke-width: 2; }
      .active { fill: #fff0dd; stroke: #ad5a23; stroke-width: 3; }
      .source { fill: #e9f4f7; stroke: #2f718c; stroke-width: 3; }
      .supply { fill: #a43b32; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #202528; }
      .subtitle { font: 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #596268; }
      .label { font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #252b2f; }
      .value { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #4f585d; }
      .node-label { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #ffffff; }
      .note { font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #596268; }
      .small { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #596268; }
      .tablehead { fill: #e9f4f7; stroke: #b8cbd2; stroke-width: 2; }
      .tablerow { fill: #fffdfa; stroke: #ddd7ca; stroke-width: 1; }

    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f718c"/>
    </marker>
  </defs>
  <rect class="background" width="1200" height="720" rx="24"/>
  <rect class="panel" x="24" y="24" width="1152" height="672" rx="18"/>
  <text class="title" x="58" y="70">CMOS Inverter · biased feedback teacher</text>
  <text class="subtitle" x="58" y="98">Exact documentation view of models/cmos_inverter.cir</text>
  <line class="wire" x1="90" y1="330" x2="95" y2="470"/>
  <line class="wire" x1="95" y1="470" x2="570" y2="560"/>
  <line class="wire" x1="90" y1="330" x2="240" y2="330"/>
  <line class="wire" x1="240" y1="330" x2="390" y2="330"/>
  <line class="wire" x1="760" y1="330" x2="575" y2="205"/>
  <line class="wire" x1="575" y1="205" x2="390" y2="330"/>
  <line class="wire" x1="570" y1="140" x2="390" y2="220"/>
  <line class="wire" x1="390" y1="220" x2="390" y2="330"/>
  <line class="wire" x1="390" y1="330" x2="390" y2="450"/>
  <line class="wire" x1="390" y1="450" x2="570" y2="560"/>
  <line class="wire" x1="570" y1="140" x2="690" y2="220"/>
  <line class="wire" x1="690" y1="220" x2="760" y2="330"/>
  <line class="wire" x1="760" y1="330" x2="690" y2="450"/>
  <line class="wire" x1="690" y1="450" x2="570" y2="560"/>
  <line class="wire" x1="760" y1="330" x2="835" y2="465"/>
  <line class="wire" x1="835" y1="465" x2="570" y2="560"/>
  <line class="wire" x1="1030" y1="330" x2="900" y2="330"/>
  <line class="wire" x1="900" y1="330" x2="570" y2="560"/>
  <line class="control" x1="760" y1="330" x2="900" y2="330"/>
  <rect class="nodebox" x="63.0" y="315" width="54" height="30" rx="15"/>
  <text class="node-label" text-anchor="middle" x="90" y="334">in</text>
  <rect class="nodebox" x="363.0" y="315" width="54" height="30" rx="15"/>
  <text class="node-label" text-anchor="middle" x="390" y="334">gate</text>
  <rect class="nodebox" x="733.0" y="315" width="54" height="30" rx="15"/>
  <text class="node-label" text-anchor="middle" x="760" y="334">raw</text>
  <rect class="nodebox" x="1003.0" y="315" width="54" height="30" rx="15"/>
  <text class="node-label" text-anchor="middle" x="1030" y="334">out</text>
  <line x1="1057.0" y1="330" x2="1121.0" y2="330" stroke="#2f718c" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="label" x="1067.0" y="317" fill="#2f718c">teacher output</text>
  <rect class="nodebox" x="543.0" y="125" width="54" height="30" rx="15"/>
  <text class="node-label" text-anchor="middle" x="570" y="144">vdd</text>
  <rect class="nodebox" x="543.0" y="545" width="54" height="30" rx="15"/>
  <text class="node-label" text-anchor="middle" x="570" y="564">0</text>
  <rect class="source" x="5.0" y="443.0" width="180" height="54" rx="12"/>
  <text class="label" text-anchor="middle" x="95" y="466">VINPUT</text>
  <text class="value" text-anchor="middle" x="95" y="486">DC −5…+5 V</text>
  <rect class="passive" x="150.0" y="303.0" width="180" height="54" rx="12"/>
  <text class="label" text-anchor="middle" x="240" y="326">RIN</text>
  <text class="value" text-anchor="middle" x="240" y="346">100 kΩ</text>
  <rect class="passive" x="485.0" y="178.0" width="180" height="54" rx="12"/>
  <text class="label" text-anchor="middle" x="575" y="201">RFB</text>
  <text class="value" text-anchor="middle" x="575" y="221">330 kΩ</text>
  <rect class="passive" x="300.0" y="193.0" width="180" height="54" rx="12"/>
  <text class="label" text-anchor="middle" x="390" y="216">RBIAS1</text>
  <text class="value" text-anchor="middle" x="390" y="236">1 MΩ</text>
  <rect class="passive" x="300.0" y="423.0" width="180" height="54" rx="12"/>
  <text class="label" text-anchor="middle" x="390" y="446">RBIAS2</text>
  <text class="value" text-anchor="middle" x="390" y="466">1 MΩ</text>
  <rect class="active" x="600.0" y="193.0" width="180" height="54" rx="12"/>
  <text class="label" text-anchor="middle" x="690" y="216">M2</text>
  <text class="value" text-anchor="middle" x="690" y="236">PMOS · W40µ/L2µ</text>
  <rect class="active" x="600.0" y="423.0" width="180" height="54" rx="12"/>
  <text class="label" text-anchor="middle" x="690" y="446">M1</text>
  <text class="value" text-anchor="middle" x="690" y="466">NMOS · W20µ/L2µ</text>
  <rect class="passive" x="745.0" y="438.0" width="180" height="54" rx="12"/>
  <text class="label" text-anchor="middle" x="835" y="461">RLEAK</text>
  <text class="value" text-anchor="middle" x="835" y="481">10 MΩ</text>
  <rect class="source" x="810.0" y="303.0" width="180" height="54" rx="12"/>
  <text class="label" text-anchor="middle" x="900" y="326">BOUT</text>
  <text class="value" text-anchor="middle" x="900" y="346">2.5 V − V(raw)</text>
  <text class="note" x="58" y="608">NMOS: Vto=0.8 V, Kp=120 µ, λ=0.02 · PMOS: Vto=−0.8 V, Kp=50 µ, λ=0.02.</text>
  <text class="note" x="58" y="629">The 1 MΩ divider biases gate near mid-supply; RFB linearizes the raw inverter.</text>
  <text class="note" x="58" y="650">Teacher sweep: VINPUT = −5…+5 V in 2.5 mV steps; output is V(out).</text>
</svg>
