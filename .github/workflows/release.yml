name: Build and release plug-ins

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install ARM toolchain
        run: |
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/arm-gnu-toolchain.tar.xz" \
            "https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.3.rel1/arm-gnu-toolchain-15.3.rel1-x86_64-arm-none-eabi.tar.xz"
          echo "563bebb2b97d53382b956d6ee1fe61e2cae26699901417234a37df505ef9b5fa  ${RUNNER_TEMP}/arm-gnu-toolchain.tar.xz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/arm-gnu-toolchain"
          tar --extract --xz \
            --file "${RUNNER_TEMP}/arm-gnu-toolchain.tar.xz" \
            --directory "${RUNNER_TEMP}/arm-gnu-toolchain" \
            --strip-components 1
          echo "${RUNNER_TEMP}/arm-gnu-toolchain/bin" >> "${GITHUB_PATH}"

      - name: Show tool versions
        run: |
          c++ --version
          arm-none-eabi-g++ --version
          arm-none-eabi-nm --version
          arm-none-eabi-readelf --version

      - name: Test, build, and inspect all plug-ins
        run: make verify

      - name: Package separate Gallery assets
        run: |
          make package
          sha256sum release/*

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: aln-disting-nt-plug-ins
          path: release/*
          if-no-files-found: error

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/aln_fold_wavefolder.o
            release/aln_distortion_bank.o
            release/aln_saturation.o
            release/aln-fold-wavefolder.zip
            release/aln-distortion-bank.zip
            release/aln-saturation.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
